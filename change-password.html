<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trocar senha — Corona Summer Opening</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16120d">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  html, body { height:100%; overflow:hidden; }
  body { padding:0; background:#0c0a08 url("assets/bg-yacht.jpg") center 30% / cover no-repeat; display:flex; align-items:center; justify-content:center; }
  body::before { content:""; position:fixed; inset:0; background:linear-gradient(180deg, rgba(10,8,6,.55), rgba(10,8,6,.75)); }
  .cp-card { position:relative; z-index:1; width:100%; max-width:380px; margin:0 20px; background:rgba(28,22,15,.86); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--border); border-radius:18px; padding:28px 26px; box-shadow:0 20px 60px rgba(0,0,0,.5); text-align:center; }
</style>
</head>
<body>

<div class="cp-card">
  <div class="eyebrow">Corona Summer Opening</div>
  <h1 style="font-size:22px; margin:8px 0 4px;">Defina sua senha</h1>
  <div class="subhead" style="margin:0 auto 20px;">Primeiro acesso — troque a senha temporária por uma só sua.</div>

  <div style="text-align:left;">
    <span class="field-label">Senha atual</span>
    <input type="password" id="current-password" placeholder="••••••••" style="width:100%; font-family:var(--font); font-size:13px; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:var(--surface-2); color:var(--text); margin-bottom:12px;">
    <span class="field-label">Nova senha (mín. 8 caracteres)</span>
    <input type="password" id="new-password" placeholder="••••••••" style="width:100%; font-family:var(--font); font-size:13px; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:var(--surface-2); color:var(--text); margin-bottom:12px;">
    <span class="field-label">Confirmar senha</span>
    <input type="password" id="confirm-password" placeholder="••••••••" style="width:100%; font-family:var(--font); font-size:13px; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:var(--surface-2); color:var(--text);">
  </div>
  <button class="btn primary" id="submit-btn" style="width:100%; justify-content:center; margin-top:16px;">Salvar senha e continuar</button>
  <div id="status" style="margin-top:10px; font-size:12px; color:var(--text-dim);"></div>
</div>

<script src="assets/app.js"></script>
<script>
document.getElementById("submit-btn").addEventListener("click", async () => {
  const p0 = document.getElementById("current-password").value;
  const p1 = document.getElementById("new-password").value;
  const p2 = document.getElementById("confirm-password").value;
  const statusEl = document.getElementById("status");
  if (!p0) { statusEl.textContent = "Informe sua senha atual."; return; }
  if (p1.length < 8) { statusEl.textContent = "A senha precisa ter pelo menos 8 caracteres."; return; }
  if (p1 !== p2) { statusEl.textContent = "As senhas não coincidem."; return; }
  statusEl.textContent = "Salvando...";
  try {
    const res = await fetch("/api/auth-change-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ currentPassword: p0, newPassword: p1 })
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      statusEl.textContent = data.error || "Não consegui salvar agora. Tente novamente.";
      return;
    }
    location.href = "index.html";
  } catch (e) {
    statusEl.textContent = "Não consegui salvar agora. Tente novamente.";
  }
});
</script>
</body>
</html>
